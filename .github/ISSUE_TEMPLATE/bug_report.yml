name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: printer
    attributes:
      label: Printer / protocol
      options:
        - Elegoo CC2 (Centauri Carbon 2 / OrangeStorm Giga)
        - Elegoo CC (Neptune 4 / Centauri Carbon)
        - Klipper / Moonraker
        - Other / Unknown
    validations:
      required: true

  - type: input
    id: printer_other
    attributes:
      label: Exact printer model (if not listed above)
      placeholder: "Elegoo Neptune 4 Pro"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code snippet or steps to reproduce.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      render: shell
